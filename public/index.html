<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>HoverTech Product Assistant</title>
<style>
  :root {
    --navy: #1B3F73;
    --bg: #F7F8FA;
    --bubble-user: #1B3F73;
    --bubble-bot: #FFFFFF;
    --border: #E2E5EA;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--navy);
    color: #fff;
    padding: 14px 16px;
    font-weight: 600;
    font-size: 16px;
    flex-shrink: 0;
  }
  header .sub {
    font-size: 12px;
    font-weight: 400;
    opacity: 0.8;
    margin-top: 2px;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    border: 1px solid var(--border);
    color: #1F2937;
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    align-self: flex-start;
    background: #FEF2F2;
    border: 1px solid #FCA5A5;
    color: #991B1B;
  }
  .bot-block {
    max-width: 85%;
    align-self: flex-start;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .status-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 10px;
    margin-bottom: 4px;
  }
  .status-confirmed { background: #DCFCE7; color: #166534; }
  .status-supported { background: #DBEAFE; color: #1E40AF; }
  .status-needs_confirmation { background: #FEF3C7; color: #92400E; }
  .status-cannot_answer { background: #F3F4F6; color: #4B5563; }
  .sources-line {
    font-size: 11px;
    color: #6B7280;
  }
  .customer-ready-box {
    background: #EFF6FF;
    border: 1px solid #BFDBFE;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px;
    color: #1E3A8A;
  }
  .customer-ready-box .label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    color: #2563EB;
    display: block;
    margin-bottom: 4px;
  }
  .internal-caveat-box {
    background: #FFFBEB;
    border: 1px solid #FDE68A;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px;
    color: #78350F;
  }
  .internal-caveat-box .label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    color: #B45309;
    display: block;
    margin-bottom: 4px;
  }
  .related-docs {
    font-size: 11px;
    color: #6B7280;
  }
  #form {
    display: flex;
    gap: 8px;
    padding: 10px;
    border-top: 1px solid var(--border);
    background: #fff;
    flex-shrink: 0;
  }
  #input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 14px;
    outline: none;
  }
  #send {
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 0 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #send:disabled { opacity: 0.5; }
</style>
</head>
<body>
  <header>
    JDHG Product Assistant
    <div class="sub">Pilot &middot; HoverTech &amp; TrenGuard &middot; answers only from a curated knowledge base</div>
  </header>
  <div id="log"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Ask about HoverTech or TrenGuard..." autocomplete="off" />
    <button id="send" type="submit">Send</button>
  </form>

  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    let history = [];

    const STATUS_LABELS = {
      confirmed: "Confirmed",
      supported: "Supported",
      needs_confirmation: "Needs confirmation",
      cannot_answer: "Cannot answer"
    };

    function addMessage(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    function addBotBlock(data) {
      const block = document.createElement("div");
      block.className = "bot-block";

      const answer = document.createElement("div");
      answer.className = "msg bot";
      const badge = document.createElement("span");
      badge.className = "status-badge status-" + (data.status || "cannot_answer");
      badge.textContent = STATUS_LABELS[data.status] || data.status || "Unknown";
      answer.appendChild(badge);
      answer.appendChild(document.createElement("br"));
      answer.appendChild(document.createTextNode(data.answer || ""));
      block.appendChild(answer);

      if (Array.isArray(data.sources) && data.sources.length) {
        const sourcesLine = document.createElement("div");
        sourcesLine.className = "sources-line";
        sourcesLine.textContent = "Sources: " + data.sources.join(", ");
        block.appendChild(sourcesLine);
      }

      if (data.customer_ready) {
        const box = document.createElement("div");
        box.className = "customer-ready-box";
        const label = document.createElement("span");
        label.className = "label";
        label.textContent = "Copy-ready customer wording";
        box.appendChild(label);
        box.appendChild(document.createTextNode(data.customer_ready));
        block.appendChild(box);
      }

      if (data.internal_caveat) {
        const box = document.createElement("div");
        box.className = "internal-caveat-box";
        const label = document.createElement("span");
        label.className = "label";
        label.textContent = "Internal caveat — do not share with customer";
        box.appendChild(label);
        box.appendChild(document.createTextNode(data.internal_caveat));
        block.appendChild(box);
      }

      if (Array.isArray(data.related_documents) && data.related_documents.length) {
        const related = document.createElement("div");
        related.className = "related-docs";
        related.textContent = "Related: " + data.related_documents.join(", ");
        block.appendChild(related);
      }

      log.appendChild(block);
      log.scrollTop = log.scrollHeight;
      return block;
    }

    addMessage("Hi, I'm the JDHG Product Assistant pilot. Ask me about specs, ARTG/GMDN details, usage steps, or warnings for the HoverTech range or TrenGuard.", "bot");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      input.value = "";
      send.disabled = true;
      const thinking = addMessage("...", "bot");

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history })
        });
        const data = await res.json();

        if (!res.ok) {
          thinking.remove();
          addMessage(data.error || "Something went wrong.", "error");
          return;
        }

        thinking.remove();
        addBotBlock(data);
        history.push({ role: "user", content: message });
        history.push({ role: "assistant", content: data.answer });
      } catch (err) {
        thinking.remove();
        addMessage("Could not reach the assistant. Check your connection and try again.", "error");
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
