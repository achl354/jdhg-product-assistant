<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>JDHG Product Assistant</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231B3F73'/%3E%3Ctext x='32' y='43' font-family='Arial, sans-serif' font-size='26' font-weight='800' fill='white' text-anchor='middle'%3EJD%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --navy: #1B3F73;
    --navy-dark: #142F57;
    --accent: #2563EB;
    --bg: #F1F4F9;
    --panel: #FFFFFF;
    --bubble-user: linear-gradient(135deg, #1B3F73, #2C5AA0);
    --border: #E2E5EA;
    --text: #1F2937;
    --muted: #6B7280;
    --code-bg: #F1F4F9;
    --status-confirmed-bg: #DCFCE7; --status-confirmed-fg: #166534;
    --status-supported-bg: #DBEAFE; --status-supported-fg: #1E40AF;
    --status-needs-bg: #FEF3C7; --status-needs-fg: #92400E;
    --status-cannot-bg: #F3F4F6; --status-cannot-fg: #4B5563;
    --error-bg: #FEF2F2; --error-border: #FCA5A5; --error-fg: #991B1B;
    --customer-bg: #EFF6FF; --customer-border: #BFDBFE; --customer-fg: #1E3A8A; --customer-accent: #2563EB;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F172A;
      --panel: #1E293B;
      --border: #334155;
      --text: #E2E8F0;
      --muted: #94A3B8;
      --code-bg: #0B1220;
      --status-confirmed-bg: #14532D; --status-confirmed-fg: #86EFAC;
      --status-supported-bg: #1E3A5F; --status-supported-fg: #93C5FD;
      --status-needs-bg: #422006; --status-needs-fg: #FCD34D;
      --status-cannot-bg: #334155; --status-cannot-fg: #CBD5E1;
      --error-bg: #3F1616; --error-border: #7F1D1D; --error-fg: #FCA5A5;
      --customer-bg: #0F2942; --customer-border: #1E4976; --customer-fg: #BFDBFE; --customer-accent: #3B82F6;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  button, textarea { font-family: inherit; }
  button:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 760px;
    margin: 0 auto;
    background: var(--panel);
    box-shadow: 0 0 40px rgba(27, 63, 115, 0.08);
  }

  header {
    background: linear-gradient(90deg, var(--navy), #24487F);
    color: #fff;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-mark {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: rgba(255,255,255,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 13px;
    flex-shrink: 0;
  }
  .header-title {
    font-weight: 700;
    font-size: 15.5px;
  }
  header .sub {
    font-size: 11.5px;
    font-weight: 400;
    opacity: 0.82;
    margin-top: 2px;
  }
  #clearBtn {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    padding: 7px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  #clearBtn:hover { background: rgba(255,255,255,0.22); }
  #clearBtn:active { transform: scale(0.96); }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    max-width: 88%;
    animation: fadeInUp 0.18s ease;
  }
  .row.user { align-self: flex-end; flex-direction: row-reverse; }
  .row.bot { align-self: flex-start; }

  .avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--navy);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-bottom: 2px;
  }

  .bubble-col { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .row.user .bubble-col { align-items: flex-end; }

  .msg {
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.45;
    font-size: 14px;
    max-width: 100%;
  }
  .msg.user {
    background: var(--bubble-user);
    color: #fff;
    border-bottom-right-radius: 4px;
    white-space: pre-wrap;
  }
  .msg.bot {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    background: var(--error-bg);
    border: 1px solid var(--error-border);
    color: var(--error-fg);
  }
  .timestamp {
    font-size: 10px;
    color: var(--muted);
    padding: 0 4px;
  }

  .md-content p { margin: 0 0 8px; }
  .md-content p:last-child { margin-bottom: 0; }
  .md-content ul { margin: 4px 0 8px; padding-left: 18px; }
  .md-content li { margin-bottom: 3px; }
  .md-heading { font-weight: 700; margin: 6px 0 4px; }
  .md-h1 { font-size: 15px; }
  .md-h2 { font-size: 14px; }
  .md-h3 { font-size: 13.5px; }
  .md-content code {
    background: var(--code-bg);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 12.5px;
  }

  .bot-block {
    max-width: 88%;
    align-self: flex-start;
    display: flex;
    flex-direction: column;
    gap: 8px;
    animation: fadeInUp 0.2s ease;
  }
  .status-badge {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 10px;
    margin-bottom: 6px;
  }
  .status-confirmed { background: var(--status-confirmed-bg); color: var(--status-confirmed-fg); }
  .status-supported { background: var(--status-supported-bg); color: var(--status-supported-fg); }
  .status-needs_confirmation { background: var(--status-needs-bg); color: var(--status-needs-fg); }
  .status-cannot_answer { background: var(--status-cannot-bg); color: var(--status-cannot-fg); }
  .sources-line {
    font-size: 11px;
    color: var(--muted);
    padding-left: 4px;
  }
  .customer-ready-box {
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13.5px;
    line-height: 1.6;
    background: var(--customer-bg);
    border: 1px solid var(--customer-border);
    border-left: 3px solid var(--customer-accent);
    color: var(--customer-fg);
  }
  .reference-line {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid rgba(127,127,127,0.2);
    font-size: 11.5px;
    font-style: italic;
    color: var(--muted);
  }
  .box-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(127,127,127,0.2);
  }
  .box-head .label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .customer-ready-box .label { color: var(--customer-accent); }
  .copy-btn {
    background: var(--panel);
    border: 1px solid var(--customer-border);
    color: var(--customer-accent);
    font-size: 10.5px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .copy-btn:hover { background: var(--customer-bg); }
  .copy-btn:active { transform: scale(0.96); }
  .related-docs {
    font-size: 11px;
    color: var(--muted);
    padding-left: 4px;
  }

  .feedback-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 4px;
  }
  .feedback-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
    line-height: 1;
    padding: 4px 8px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
  }
  .feedback-btn:hover { background: var(--bg); border-color: var(--muted); }
  .feedback-btn:active { transform: scale(0.9); }
  .feedback-btn.selected { border-color: var(--accent); color: var(--accent); }
  .feedback-btn:disabled { cursor: default; opacity: 0.6; }
  .feedback-note { font-size: 11px; color: var(--muted); }

  .typing-row .msg.bot {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 12px 16px;
  }
  .typing-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #9CA3AF;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  #form {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: var(--panel);
    flex-shrink: 0;
  }
  #input {
    flex: 1;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 18px;
    font-size: 14px;
    outline: none;
    resize: none;
    background: var(--panel);
    color: var(--text);
    line-height: 1.4;
    max-height: 140px;
    overflow-y: auto;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 22px;
    padding: 0 20px;
    height: 40px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  #send:hover:not(:disabled) { background: var(--navy-dark); }
  #send:active:not(:disabled) { transform: scale(0.96); }
  #send:disabled { opacity: 0.5; cursor: default; }

  @media (max-width: 780px) {
    #app { max-width: none; box-shadow: none; }
    .row, .bot-block { max-width: 96%; }
  }
</style>
</head>
<body>
  <div id="app">
    <header>
      <div class="header-left">
        <div class="brand-mark">JD</div>
        <div>
          <div class="header-title">JDHG Product Assistant</div>
          <div class="sub">Pilot &middot; answers only from a curated knowledge base</div>
        </div>
      </div>
      <button id="clearBtn" type="button">Clear</button>
    </header>
    <div id="log" role="log" aria-label="Conversation"></div>
    <div id="srAnnouncer" class="sr-only" aria-live="polite"></div>
    <form id="form">
      <textarea id="input" rows="1" placeholder="Ask about any JDHG product... (Enter to send, Shift+Enter for a new line)" autocomplete="off"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </div>

  <script>
    const log = document.getElementById("log");
    const srAnnouncer = document.getElementById("srAnnouncer");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const clearBtn = document.getElementById("clearBtn");

    const STORAGE_KEY = "jdhg-chat-state-v1";
    const SCROLL_NEAR_BOTTOM_PX = 80;

    let history = [];
    let displayLog = [];

    const STATUS_LABELS = {
      confirmed: "Confirmed",
      supported: "Supported",
      needs_confirmation: "Needs confirmation",
      cannot_answer: "Cannot answer"
    };

    const GREETING = "Hi, I'm the JDHG Product Assistant pilot. Ask me about specs, ARTG/GMDN details, usage steps, or warnings for any product in the range.";

    function timeNow() {
      return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function isNearBottom() {
      return log.scrollHeight - log.scrollTop - log.clientHeight < SCROLL_NEAR_BOTTOM_PX;
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ history, displayLog }));
      } catch (err) {
        /* storage full or unavailable (e.g. private browsing) — non-fatal */
      }
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed.history) || !Array.isArray(parsed.displayLog)) return null;
        return parsed;
      } catch (err) {
        return null;
      }
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function inlineFormat(str) {
      return str
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/`(.+?)`/g, "<code>$1</code>");
    }

    // Minimal, dependency-free renderer for the subset of markdown the
    // model actually produces (headings, bold, inline code, bullet lists,
    // paragraphs). HTML-escapes first, so only our own controlled tags are
    // ever inserted — safe against a model output containing "<script>" etc.
    function renderMarkdown(text) {
      const lines = escapeHtml(text || "").split("\n");
      let html = "";
      let inList = false;
      for (const line of lines) {
        const headerMatch = line.match(/^(#{1,3})\s+(.*)$/);
        const bulletMatch = line.match(/^[-*]\s+(.*)$/);
        if (headerMatch) {
          if (inList) { html += "</ul>"; inList = false; }
          html += `<div class="md-heading md-h${headerMatch[1].length}">${inlineFormat(headerMatch[2])}</div>`;
        } else if (bulletMatch) {
          if (!inList) { html += "<ul>"; inList = true; }
          html += `<li>${inlineFormat(bulletMatch[1])}</li>`;
        } else if (line.trim() === "") {
          if (inList) { html += "</ul>"; inList = false; }
        } else {
          if (inList) { html += "</ul>"; inList = false; }
          html += `<p>${inlineFormat(line)}</p>`;
        }
      }
      if (inList) html += "</ul>";
      return html;
    }

    // customer_ready is instructed to end with a trailing "Reference: ..."
    // line, on its own paragraph, rather than citing the source mid-sentence
    // (see lib/prompt.js rule 7). Render that line distinctly (smaller,
    // muted) instead of as a regular paragraph — falls back to plain
    // renderMarkdown if the model didn't follow the format, so this never
    // breaks rendering even on an unexpected shape.
    function renderCustomerReady(text) {
      const raw = text || "";
      const match = raw.match(/^([\s\S]*?)\n\s*\n(Reference:.+)$/i);
      if (!match) return renderMarkdown(raw);
      const [, body, reference] = match;
      return renderMarkdown(body) + `<div class="reference-line">${inlineFormat(escapeHtml(reference.trim()))}</div>`;
    }

    function autoResizeInput() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 140) + "px";
    }

    function addSimpleMessage(text, cls, presetTime) {
      const wasNearBottom = cls === "user" ? true : isNearBottom();

      const row = document.createElement("div");
      row.className = "row " + (cls === "user" ? "user" : "bot");

      if (cls !== "user") {
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = "JD";
        row.appendChild(avatar);
      }

      const col = document.createElement("div");
      col.className = "bubble-col";

      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      col.appendChild(div);

      const ts = document.createElement("div");
      ts.className = "timestamp";
      ts.textContent = presetTime || timeNow();
      col.appendChild(ts);

      row.appendChild(col);
      log.appendChild(row);
      if (wasNearBottom) log.scrollTop = log.scrollHeight;
      return row;
    }

    function addTypingIndicator() {
      const wasNearBottom = isNearBottom();
      const row = document.createElement("div");
      row.className = "row bot typing-row";
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = "JD";
      row.appendChild(avatar);

      const bubble = document.createElement("div");
      bubble.className = "msg bot";
      for (let i = 0; i < 3; i++) {
        const dot = document.createElement("span");
        dot.className = "typing-dot";
        bubble.appendChild(dot);
      }
      row.appendChild(bubble);
      log.appendChild(row);
      if (wasNearBottom) log.scrollTop = log.scrollHeight;
      return row;
    }

    // Live-updating preview shown while the answer streams in — just the
    // growing text, no badge/sources/etc. yet (those only exist once the
    // full structured answer contract has finished streaming).
    function addStreamingPreview() {
      const wasNearBottom = isNearBottom();
      const row = document.createElement("div");
      row.className = "row bot";
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = "JD";
      row.appendChild(avatar);

      const col = document.createElement("div");
      col.className = "bubble-col";
      const bubble = document.createElement("div");
      bubble.className = "msg bot";
      const content = document.createElement("div");
      content.className = "md-content";
      bubble.appendChild(content);
      col.appendChild(bubble);
      row.appendChild(col);

      log.appendChild(row);
      if (wasNearBottom) log.scrollTop = log.scrollHeight;
      return { row, content };
    }

    function updateStreamingPreview(content, text) {
      const wasNearBottom = isNearBottom();
      content.innerHTML = renderMarkdown(text);
      if (wasNearBottom) log.scrollTop = log.scrollHeight;
    }

    function copyToClipboard(text, btn) {
      const onDone = () => {
        const original = btn.textContent;
        btn.textContent = "Copied!";
        setTimeout(() => { btn.textContent = original; }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(onDone).catch(() => fallbackCopy(text, onDone));
      } else {
        fallbackCopy(text, onDone);
      }
    }

    function fallbackCopy(text, onDone) {
      const area = document.createElement("textarea");
      area.value = text;
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.appendChild(area);
      area.select();
      try { document.execCommand("copy"); } catch (err) { /* no-op */ }
      document.body.removeChild(area);
      onDone();
    }

    function sendFeedback(question, answer, rating) {
      fetch("/api/feedback", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, answer, rating })
      }).catch(() => { /* best-effort — feedback isn't critical to the chat flow */ });
    }

    function addFeedbackRow(question, answerText) {
      const row = document.createElement("div");
      row.className = "feedback-row";

      const upBtn = document.createElement("button");
      upBtn.type = "button";
      upBtn.className = "feedback-btn";
      upBtn.setAttribute("aria-label", "Helpful");
      upBtn.textContent = "\u{1F44D}";

      const downBtn = document.createElement("button");
      downBtn.type = "button";
      downBtn.className = "feedback-btn";
      downBtn.setAttribute("aria-label", "Not helpful");
      downBtn.textContent = "\u{1F44E}";

      const settle = (chosenBtn, otherBtn, rating) => {
        chosenBtn.classList.add("selected");
        upBtn.disabled = true;
        downBtn.disabled = true;
        const note = document.createElement("span");
        note.className = "feedback-note";
        note.textContent = "Thanks for the feedback!";
        row.appendChild(note);
        sendFeedback(question, answerText, rating);
      };

      upBtn.addEventListener("click", () => settle(upBtn, downBtn, "up"));
      downBtn.addEventListener("click", () => settle(downBtn, upBtn, "down"));

      row.appendChild(upBtn);
      row.appendChild(downBtn);
      return row;
    }

    function addBotBlock(data, question, presetTime) {
      const wasNearBottom = isNearBottom();
      const block = document.createElement("div");
      block.className = "bot-block";

      const row = document.createElement("div");
      row.className = "row bot";
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = "JD";
      row.appendChild(avatar);

      const col = document.createElement("div");
      col.className = "bubble-col";

      const answer = document.createElement("div");
      answer.className = "msg bot";
      const badge = document.createElement("span");
      badge.className = "status-badge status-" + (data.status || "cannot_answer");
      badge.textContent = STATUS_LABELS[data.status] || data.status || "Unknown";
      answer.appendChild(badge);
      const content = document.createElement("div");
      content.className = "md-content";
      content.innerHTML = renderMarkdown(data.answer || "");
      answer.appendChild(content);
      col.appendChild(answer);

      const ts = document.createElement("div");
      ts.className = "timestamp";
      ts.textContent = presetTime || timeNow();
      col.appendChild(ts);

      row.appendChild(col);
      block.appendChild(row);

      if (Array.isArray(data.sources) && data.sources.length) {
        const sourcesLine = document.createElement("div");
        sourcesLine.className = "sources-line";
        sourcesLine.textContent = "Sources: " + data.sources.join(", ");
        block.appendChild(sourcesLine);
      }

      if (data.customer_ready) {
        const box = document.createElement("div");
        box.className = "customer-ready-box";
        const head = document.createElement("div");
        head.className = "box-head";
        const label = document.createElement("span");
        label.className = "label";
        label.textContent = "Copy-ready customer wording";
        head.appendChild(label);
        const copyBtn = document.createElement("button");
        copyBtn.type = "button";
        copyBtn.className = "copy-btn";
        copyBtn.textContent = "Copy";
        copyBtn.addEventListener("click", () => copyToClipboard(data.customer_ready, copyBtn));
        head.appendChild(copyBtn);
        box.appendChild(head);
        const content2 = document.createElement("div");
        content2.className = "md-content";
        content2.innerHTML = renderCustomerReady(data.customer_ready);
        box.appendChild(content2);
        block.appendChild(box);
      }

      if (Array.isArray(data.related_documents) && data.related_documents.length) {
        const related = document.createElement("div");
        related.className = "related-docs";
        related.textContent = "Related: " + data.related_documents.join(", ");
        block.appendChild(related);
      }

      block.appendChild(addFeedbackRow(question || "", data.answer || ""));

      log.appendChild(block);
      if (wasNearBottom) log.scrollTop = log.scrollHeight;
      srAnnouncer.textContent = "Assistant replied.";
      return block;
    }

    function resetConversation() {
      history = [];
      displayLog = [];
      log.innerHTML = "";
      const time = timeNow();
      addSimpleMessage(GREETING, "bot", time);
      displayLog.push({ type: "bot-simple", text: GREETING, time });
      saveState();
    }

    function replayDisplayLog(saved) {
      history = saved.history;
      displayLog = saved.displayLog;
      log.innerHTML = "";
      for (const entry of saved.displayLog) {
        if (entry.type === "user") addSimpleMessage(entry.text, "user", entry.time);
        else if (entry.type === "error") addSimpleMessage(entry.text, "error", entry.time);
        else if (entry.type === "bot-simple") addSimpleMessage(entry.text, "bot", entry.time);
        else if (entry.type === "bot-block") addBotBlock(entry.data, entry.question, entry.time);
      }
    }

    const saved = loadState();
    if (saved && saved.displayLog.length) {
      replayDisplayLog(saved);
    } else {
      resetConversation();
    }

    clearBtn.addEventListener("click", resetConversation);

    input.addEventListener("input", autoResizeInput);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      const userTime = timeNow();
      addSimpleMessage(message, "user", userTime);
      displayLog.push({ type: "user", text: message, time: userTime });
      saveState();

      input.value = "";
      autoResizeInput();
      send.disabled = true;
      const thinking = addTypingIndicator();
      let streamingRow = null;
      let streamingContent = null;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history })
        });

        if (!res.ok) {
          const data = await res.json();
          thinking.remove();
          const errorTime = timeNow();
          addSimpleMessage(data.error || "Something went wrong.", "error", errorTime);
          displayLog.push({ type: "error", text: data.error || "Something went wrong.", time: errorTime });
          saveState();
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let finalData = null;

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          let newlineIndex;
          while ((newlineIndex = buffer.indexOf("\n")) !== -1) {
            const line = buffer.slice(0, newlineIndex).trim();
            buffer = buffer.slice(newlineIndex + 1);
            if (!line) continue;

            let frame;
            try {
              frame = JSON.parse(line);
            } catch (err) {
              continue;
            }

            if (frame.type === "answer_delta") {
              if (!streamingRow) {
                thinking.remove();
                const built = addStreamingPreview();
                streamingRow = built.row;
                streamingContent = built.content;
              }
              updateStreamingPreview(streamingContent, frame.text);
            } else if (frame.type === "final") {
              finalData = frame.data;
            }
          }
        }

        if (streamingRow) streamingRow.remove();
        thinking.remove();

        if (!finalData) {
          addSimpleMessage("Something went wrong.", "error");
          return;
        }

        const botTime = timeNow();
        addBotBlock(finalData, message, botTime);
        displayLog.push({ type: "bot-block", data: finalData, question: message, time: botTime });
        history.push({ role: "user", content: message });
        history.push({ role: "assistant", content: finalData.answer });
        saveState();
      } catch (err) {
        thinking.remove();
        if (streamingRow) streamingRow.remove();
        const errorTime = timeNow();
        const errorText = "Could not reach the assistant. Check your connection and try again.";
        addSimpleMessage(errorText, "error", errorTime);
        displayLog.push({ type: "error", text: errorText, time: errorTime });
        saveState();
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
