<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>JDHG Product Assistant</title>
<style>
  :root {
    --navy: #1B3F73;
    --navy-dark: #142F57;
    --accent: #2563EB;
    --bg: #F1F4F9;
    --panel: #FFFFFF;
    --bubble-user: linear-gradient(135deg, #1B3F73, #2C5AA0);
    --border: #E2E5EA;
    --text: #1F2937;
    --muted: #6B7280;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 760px;
    margin: 0 auto;
    background: var(--panel);
    box-shadow: 0 0 40px rgba(27, 63, 115, 0.08);
  }

  header {
    background: linear-gradient(90deg, var(--navy), #24487F);
    color: #fff;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-mark {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: rgba(255,255,255,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 13px;
    flex-shrink: 0;
  }
  .header-title {
    font-weight: 700;
    font-size: 15.5px;
  }
  header .sub {
    font-size: 11.5px;
    font-weight: 400;
    opacity: 0.82;
    margin-top: 2px;
  }
  #clearBtn {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    padding: 7px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  #clearBtn:hover { background: rgba(255,255,255,0.22); }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    max-width: 88%;
    animation: fadeInUp 0.18s ease;
  }
  .row.user { align-self: flex-end; flex-direction: row-reverse; }
  .row.bot { align-self: flex-start; }

  .avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--navy);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-bottom: 2px;
  }

  .bubble-col { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .row.user .bubble-col { align-items: flex-end; }

  .msg {
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.45;
    font-size: 14px;
    max-width: 100%;
  }
  .msg.user {
    background: var(--bubble-user);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    background: #FEF2F2;
    border: 1px solid #FCA5A5;
    color: #991B1B;
  }
  .timestamp {
    font-size: 10px;
    color: var(--muted);
    padding: 0 4px;
  }

  .md-content p { margin: 0 0 8px; }
  .md-content p:last-child { margin-bottom: 0; }
  .md-content ul { margin: 4px 0 8px; padding-left: 18px; }
  .md-content li { margin-bottom: 3px; }
  .md-heading { font-weight: 700; margin: 6px 0 4px; }
  .md-h1 { font-size: 15px; }
  .md-h2 { font-size: 14px; }
  .md-h3 { font-size: 13.5px; }
  .md-content code {
    background: #F1F4F9;
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 12.5px;
  }

  .bot-block {
    max-width: 88%;
    align-self: flex-start;
    display: flex;
    flex-direction: column;
    gap: 8px;
    animation: fadeInUp 0.2s ease;
  }
  .status-badge {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 10px;
    margin-bottom: 6px;
  }
  .status-confirmed { background: #DCFCE7; color: #166534; }
  .status-supported { background: #DBEAFE; color: #1E40AF; }
  .status-needs_confirmation { background: #FEF3C7; color: #92400E; }
  .status-cannot_answer { background: #F3F4F6; color: #4B5563; }
  .sources-line {
    font-size: 11px;
    color: var(--muted);
    padding-left: 4px;
  }
  .customer-ready-box, .internal-caveat-box {
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13.5px;
    line-height: 1.6;
  }
  .customer-ready-box {
    background: #EFF6FF;
    border: 1px solid #BFDBFE;
    border-left: 3px solid #2563EB;
    color: #1E3A8A;
  }
  .internal-caveat-box {
    background: #FFFBEB;
    border: 1px solid #FDE68A;
    border-left: 3px solid #D97706;
    color: #78350F;
  }
  .box-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  .box-head .label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .customer-ready-box .label { color: #2563EB; }
  .box-content p { margin: 0 0 10px; }
  .box-content p:last-child { margin-bottom: 0; }
  .internal-caveat-box .label { color: #B45309; }
  .copy-btn {
    background: #fff;
    border: 1px solid #BFDBFE;
    color: #2563EB;
    font-size: 10.5px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
    cursor: pointer;
  }
  .copy-btn:hover { background: #DBEAFE; }
  .related-docs {
    font-size: 11px;
    color: var(--muted);
    padding-left: 4px;
  }

  .typing-row .msg.bot {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 12px 16px;
  }
  .typing-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #9CA3AF;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  #form {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: #fff;
    flex-shrink: 0;
  }
  #input {
    flex: 1;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 22px;
    font-size: 14px;
    outline: none;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 22px;
    padding: 0 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #send:hover:not(:disabled) { background: var(--navy-dark); }
  #send:disabled { opacity: 0.5; cursor: default; }

  @media (max-width: 780px) {
    #app { max-width: none; box-shadow: none; }
    .row, .bot-block { max-width: 96%; }
  }
</style>
</head>
<body>
  <div id="app">
    <header>
      <div class="header-left">
        <div class="brand-mark">JD</div>
        <div>
          <div class="header-title">JDHG Product Assistant</div>
          <div class="sub">Pilot &middot; answers only from a curated knowledge base</div>
        </div>
      </div>
      <button id="clearBtn" type="button">Clear</button>
    </header>
    <div id="log"></div>
    <form id="form">
      <input id="input" type="text" placeholder="Ask about any JDHG product..." autocomplete="off" />
      <button id="send" type="submit">Send</button>
    </form>
  </div>

  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const clearBtn = document.getElementById("clearBtn");
    let history = [];

    const STATUS_LABELS = {
      confirmed: "Confirmed",
      supported: "Supported",
      needs_confirmation: "Needs confirmation",
      cannot_answer: "Cannot answer"
    };

    const GREETING = "Hi, I'm the JDHG Product Assistant pilot. Ask me about specs, ARTG/GMDN details, usage steps, or warnings for any product in the range.";

    function timeNow() {
      return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function inlineFormat(str) {
      return str
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/`(.+?)`/g, "<code>$1</code>");
    }

    // Minimal, dependency-free renderer for the subset of markdown the
    // model actually produces (headings, bold, inline code, bullet lists,
    // paragraphs). HTML-escapes first, so only our own controlled tags are
    // ever inserted — safe against a model output containing "<script>" etc.
    function renderMarkdown(text) {
      const lines = escapeHtml(text || "").split("\n");
      let html = "";
      let inList = false;
      for (const line of lines) {
        const headerMatch = line.match(/^(#{1,3})\s+(.*)$/);
        const bulletMatch = line.match(/^[-*]\s+(.*)$/);
        if (headerMatch) {
          if (inList) { html += "</ul>"; inList = false; }
          html += `<div class="md-heading md-h${headerMatch[1].length}">${inlineFormat(headerMatch[2])}</div>`;
        } else if (bulletMatch) {
          if (!inList) { html += "<ul>"; inList = true; }
          html += `<li>${inlineFormat(bulletMatch[1])}</li>`;
        } else if (line.trim() === "") {
          if (inList) { html += "</ul>"; inList = false; }
        } else {
          if (inList) { html += "</ul>"; inList = false; }
          html += `<p>${inlineFormat(line)}</p>`;
        }
      }
      if (inList) html += "</ul>";
      return html;
    }

    // Simpler than renderMarkdown: customer_ready/internal_caveat are plain
    // humanized prose with no markdown symbols by design (see lib/prompt.js),
    // so this only needs to turn blank-line-separated paragraphs into <p>
    // tags rather than one run-on text block.
    function renderParagraphs(text) {
      return escapeHtml(text || "")
        .split(/\n\s*\n/)
        .map((para) => para.trim())
        .filter(Boolean)
        .map((para) => `<p>${para.replace(/\n/g, "<br>")}</p>`)
        .join("");
    }

    function addSimpleMessage(text, cls) {
      const row = document.createElement("div");
      row.className = "row " + (cls === "user" ? "user" : "bot");

      if (cls !== "user") {
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = "JD";
        row.appendChild(avatar);
      }

      const col = document.createElement("div");
      col.className = "bubble-col";

      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      col.appendChild(div);

      const ts = document.createElement("div");
      ts.className = "timestamp";
      ts.textContent = timeNow();
      col.appendChild(ts);

      row.appendChild(col);
      log.appendChild(row);
      log.scrollTop = log.scrollHeight;
      return row;
    }

    function addTypingIndicator() {
      const row = document.createElement("div");
      row.className = "row bot typing-row";
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = "JD";
      row.appendChild(avatar);

      const bubble = document.createElement("div");
      bubble.className = "msg bot";
      for (let i = 0; i < 3; i++) {
        const dot = document.createElement("span");
        dot.className = "typing-dot";
        bubble.appendChild(dot);
      }
      row.appendChild(bubble);
      log.appendChild(row);
      log.scrollTop = log.scrollHeight;
      return row;
    }

    function copyToClipboard(text, btn) {
      const onDone = () => {
        const original = btn.textContent;
        btn.textContent = "Copied!";
        setTimeout(() => { btn.textContent = original; }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(onDone).catch(() => fallbackCopy(text, onDone));
      } else {
        fallbackCopy(text, onDone);
      }
    }

    function fallbackCopy(text, onDone) {
      const area = document.createElement("textarea");
      area.value = text;
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.appendChild(area);
      area.select();
      try { document.execCommand("copy"); } catch (err) { /* no-op */ }
      document.body.removeChild(area);
      onDone();
    }

    function addBotBlock(data) {
      const block = document.createElement("div");
      block.className = "bot-block";

      const row = document.createElement("div");
      row.className = "row bot";
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = "JD";
      row.appendChild(avatar);

      const col = document.createElement("div");
      col.className = "bubble-col";

      const answer = document.createElement("div");
      answer.className = "msg bot";
      const badge = document.createElement("span");
      badge.className = "status-badge status-" + (data.status || "cannot_answer");
      badge.textContent = STATUS_LABELS[data.status] || data.status || "Unknown";
      answer.appendChild(badge);
      const content = document.createElement("div");
      content.className = "md-content";
      content.innerHTML = renderMarkdown(data.answer || "");
      answer.appendChild(content);
      col.appendChild(answer);

      const ts = document.createElement("div");
      ts.className = "timestamp";
      ts.textContent = timeNow();
      col.appendChild(ts);

      row.appendChild(col);
      block.appendChild(row);

      if (Array.isArray(data.sources) && data.sources.length) {
        const sourcesLine = document.createElement("div");
        sourcesLine.className = "sources-line";
        sourcesLine.textContent = "Sources: " + data.sources.join(", ");
        block.appendChild(sourcesLine);
      }

      if (data.customer_ready) {
        const box = document.createElement("div");
        box.className = "customer-ready-box";
        const head = document.createElement("div");
        head.className = "box-head";
        const label = document.createElement("span");
        label.className = "label";
        label.textContent = "Copy-ready customer wording";
        head.appendChild(label);
        const copyBtn = document.createElement("button");
        copyBtn.type = "button";
        copyBtn.className = "copy-btn";
        copyBtn.textContent = "Copy";
        copyBtn.addEventListener("click", () => copyToClipboard(data.customer_ready, copyBtn));
        head.appendChild(copyBtn);
        box.appendChild(head);
        const content = document.createElement("div");
        content.className = "box-content";
        content.innerHTML = renderParagraphs(data.customer_ready);
        box.appendChild(content);
        block.appendChild(box);
      }

      if (data.internal_caveat) {
        const box = document.createElement("div");
        box.className = "internal-caveat-box";
        const head = document.createElement("div");
        head.className = "box-head";
        const label = document.createElement("span");
        label.className = "label";
        label.textContent = "Internal caveat — do not share with customer";
        head.appendChild(label);
        box.appendChild(head);
        const content = document.createElement("div");
        content.className = "box-content";
        content.innerHTML = renderParagraphs(data.internal_caveat);
        box.appendChild(content);
        block.appendChild(box);
      }

      if (Array.isArray(data.related_documents) && data.related_documents.length) {
        const related = document.createElement("div");
        related.className = "related-docs";
        related.textContent = "Related: " + data.related_documents.join(", ");
        block.appendChild(related);
      }

      log.appendChild(block);
      log.scrollTop = log.scrollHeight;
      return block;
    }

    function resetConversation() {
      history = [];
      log.innerHTML = "";
      addSimpleMessage(GREETING, "bot");
    }

    resetConversation();
    clearBtn.addEventListener("click", resetConversation);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      addSimpleMessage(message, "user");
      input.value = "";
      send.disabled = true;
      const thinking = addTypingIndicator();

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history })
        });
        const data = await res.json();

        if (!res.ok) {
          thinking.remove();
          addSimpleMessage(data.error || "Something went wrong.", "error");
          return;
        }

        thinking.remove();
        addBotBlock(data);
        history.push({ role: "user", content: message });
        history.push({ role: "assistant", content: data.answer });
      } catch (err) {
        thinking.remove();
        addSimpleMessage("Could not reach the assistant. Check your connection and try again.", "error");
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
